name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format (check)
        run: ruff format --check .
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test-suite (headless)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          if ! python -m pytest 2>&1 | tee pytest.log; then
            grep -E '^(FAILED|ERROR) ' pytest.log | head -6 | sed 's/^/::error::/'
            grep -E '^E ' pytest.log | head -4 | sed 's/^/::error::/'
            exit 1
          fi

  lint-compile:
    name: Byte-compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile every module
        run: python -m compileall -q app tests main.py tools

  e2e:
    name: End-to-end (real browser)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run the real-browser e2e test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          if ! python -m pytest tests/test_e2e_real.py -q -o addopts="" 2>&1 | tee pytest.log; then
            grep -E '^(FAILED|ERROR) ' pytest.log | head -6 | sed 's/^/::error::/'
            grep -E '^E ' pytest.log | head -4 | sed 's/^/::error::/'
            exit 1
          fi

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with a coverage threshold
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=88
